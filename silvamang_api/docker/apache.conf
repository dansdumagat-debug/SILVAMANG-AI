ServerName silvamangai.online
ServerTokens Prod
ServerSignature Off
<VirtualHost *:8080>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Uploaded files must never execute as PHP or override Apache rules.
    <Directory /var/www/html/storage/app/public>
        AllowOverride None
        Options -Indexes -ExecCGI
        <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|htaccess)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
